function hotelDateValue(s){let [m,y]=s.split('.').map(Number);return new Date(y,m-1,1).getTime()}
function renderHotels(){let q=($('hotelSearch')?.value||'').toLowerCase();let arr=[...HOTELS].sort((a,b)=>hotelDateValue(b.date)-hotelDateValue(a.date)).filter(x=>`${x.n} ${x.city}`.toLowerCase().includes(q));$('hotelList').innerHTML=arr.map((x,i)=>`<div class="row"><div class="rowBtn"><span class="visual ${x.photo?'hasPhoto':''}">${x.photo?`<img src="${esc(x.photo)}" alt="${esc(x.n)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`:''}<span class="visualMark" style="${x.photo?'display:none':''}"><small>Photo à ajouter</small></span><span class="num">${i+1}</span></span><span class="cardInfo"><span class="name">${esc(x.n)}</span><span class="meta">${esc(x.city)} · ${esc(x.date)}</span><span class="badges"><span class="badge">${x.label || (x.stars ? "★".repeat(x.stars)+" "+x.stars+" étoiles" : "Catégorie à vérifier")}</span></span></span><span class="chev">›</span></div></div>`).join('')}
const KEY='voyages_restaurants_final_v3';let items;try{items=JSON.parse(localStorage.getItem(KEY))||BASE}catch{items=BASE}items=items.map(x=>({...x,photo:([1,9,11,13,14,16].includes(Number(x.i))?WEB_PHOTOS[x.i]:(x.photo||WEB_PHOTOS[x.i]||''))}));let filter='all',openId=null,editId=null,world=null,alt=1.25;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stars=s=>(String(s||'').match(/★/g)||[]).length;const persist=()=>{localStorage.setItem(KEY,JSON.stringify(items));$('count').textContent=items.length;if(world)world.labelsData(globePoints())};const toast=t=>{let e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)};const globePoints=()=>[...items.filter(x=>Number.isFinite(+x.lat)&&Number.isFinite(+x.lon)).map((x,i)=>({...x,_n:i+1,_type:'restaurant',_symbol:'📍'})),...HOTELS.filter(x=>Number.isFinite(+x.lat)&&Number.isFinite(+x.lon)).map((x,i)=>({...x,name:x.n,_n:i+1,_type:'hotel',_symbol:'📌'}))];
function badges(x){let a=[];if(x.mich)a.push(`<span class="badge ${stars(x.mich)?'star':''}">${esc(x.mich.includes('Sélection')?'● Sélection Guide MICHELIN':x.mich)}</span>`);if(x.gault&&x.gault!=='—')a.push(`<span class="badge">Gault&Millau ${esc(x.gault)}</span>`);return a.join('')}
const dateValue=s=>{let [d,m,y]=String(s||'').split('.').map(Number);return new Date(y||0,(m||1)-1,d||1).getTime()||0};
function render(){let q=$('search').value.toLowerCase();let arr=[...items].sort((a,b)=>dateValue(b.date)-dateValue(a.date)).map((x,i)=>({...x,_n:i+1})).filter(x=>`${x.name} ${x.city} ${x.address||''}`.toLowerCase().includes(q)).filter(x=>filter==='all'||(filter==='star'&&stars(x.mich))||(filter==='sel'&&x.mich&&!stars(x.mich))||(filter==='gm'&&x.gault&&x.gault!=='—'));$('list').innerHTML=arr.length?arr.map(x=>`<div class="row"><button class="rowBtn" onclick="toggle('${x.i||x._n}')"><span class="visual ${x.photo?'hasPhoto':''}">${x.photo?`<img src="${esc(x.photo)}" alt="${esc(x.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`:''}<span class="visualMark" style="${x.photo?'display:none':''}"><small>Photo à ajouter</small></span><span class="num">${x._n}</span></span><span class="cardInfo"><span class="name">${esc(x.name)}</span><span class="meta">${esc(x.city)} · ${esc(x.date)}</span><span class="badges">${badges(x)}</span></span><span class="chev">›</span></button>${openId===(x.i||x._n)?`<div class="detail">${x.address?`<div>${esc(x.address)}</div>`:''}${x.notes?`<p>${esc(x.notes)}</p>`:''}<div class="actions"><button class="mini" onclick="showOnGlobe('${x.i||x._n}')">Voir sur le globe</button><button class="mini" onclick="edit('${x.i||x._n}')">Modifier</button><button class="mini danger" onclick="removeItem('${x.i||x._n}')">Supprimer</button></div></div>`:''}</div>`).join(''):'<div class="empty">Aucun résultat.</div>'}
window.toggle=id=>{openId=openId==id?null:id;render()};window.removeItem=id=>{let x=find(id);if(confirm(`Supprimer « ${x.name} » ?`)){items=items.filter(y=>String(y.i||y._uid)!==String(id));persist();render()}};const find=id=>items.find(x=>String(x.i||x._uid)===String(id));window.showOnGlobe=id=>{let x=find(id);showTab('globe');selectPoint(x);if(world)world.pointOfView({lat:+x.lat,lng:+x.lon,altitude:.65},800)};
function selectPoint(x){$('pinCard').style.display='block';$('pinCard').innerHTML=`<button class="x" onclick="pinCard.style.display='none'">×</button><div class="eyebrow">${esc(x.date)}</div><h3>${esc(x.name)}</h3><div class="meta">${esc(x.city)}</div><div class="badges">${badges(x)}</div>`}
function selectGlobePoint(x){$('pinCard').style.display='block';if(x._type==='hotel'){$('pinCard').innerHTML=`<button class="x" onclick="pinCard.style.display='none'">×</button><div class="eyebrow">◆ Hôtel · ${esc(x.date)}</div><h3>${esc(x.name)}</h3><div class="meta">${esc(x.city)}</div><div class="badges"><span class="badge">${esc(x.label || (x.stars ? '★'.repeat(x.stars)+' '+x.stars+' étoiles' : 'Hôtel'))}</span></div>`}else{selectPoint(x)}}
function initGlobe(){if(typeof Globe!=='function'){toast('Connexion requise pour charger le globe 3D');return}world=Globe()($('globe')).globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-night.jpg').bumpImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png').backgroundImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/night-sky.png').showAtmosphere(true).atmosphereColor('#d5b56f').atmosphereAltitude(.14).labelsData(globePoints()).labelLat('lat').labelLng('lon').labelText('_symbol').labelSize(.72).labelDotRadius(0).labelAltitude(.025).labelColor(()=> '#f4e5c7').labelLabel(x=>`<div style="background:#160d0bcc;border:1px solid #755a36;padding:9px;border-radius:10px"><b>${x._symbol} ${esc(x.name)}</b><br>${esc(x.city)} · ${esc(x.date)}</div>`).onLabelClick(x=>{selectGlobePoint(x);world.pointOfView({lat:+x.lat,lng:+x.lon,altitude:.65},700)});world.pointOfView({lat:46.5,lng:8,altitude:1.25},0);world.controls().autoRotate=true;world.controls().autoRotateSpeed=.22;resize();addEventListener('resize',resize)}function resize(){if(world)world.width(innerWidth).height($('globeScreen').clientHeight)}$('zin').onclick=()=>{if(world){alt=Math.max(.35,alt*.78);let p=world.pointOfView();world.pointOfView({lat:p.lat,lng:p.lng,altitude:alt},350)}};$('zout').onclick=()=>{if(world){alt=Math.min(3,alt*1.28);let p=world.pointOfView();world.pointOfView({lat:p.lat,lng:p.lng,altitude:alt},350)}};
function showTab(t){$('globeScreen').classList.toggle('active',t==='globe');$('listScreen').classList.toggle('active',t==='list');$('hotelScreen').classList.toggle('active',t==='hotels');$('tabGlobe').classList.toggle('on',t==='globe');$('tabList').classList.toggle('on',t==='list');$('tabHotels').classList.toggle('on',t==='hotels');if(t==='list')render();if(t==='hotels')renderHotels();if(t==='globe')setTimeout(resize,50)}$('tabGlobe').onclick=()=>showTab('globe');$('tabList').onclick=()=>showTab('list');$('tabHotels').onclick=()=>showTab('hotels');$('search').oninput=render;$('hotelSearch').oninput=renderHotels;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));render()});
function openForm(x=null){editId=x?String(x.i||x._uid):null;$('formTitle').textContent=x?'Modifier l’expérience':'Nouvelle expérience';$('name').value=x?.name||'';$('city').value=x?.city||'';$('address').value=x?.address||'';$('mich').value=['','Sélection Guide MICHELIN','Bib Gourmand','★','★★','★★★'].includes(x?.mich)?x.mich:'';$('gault').value=x?.gault==='—'?'':x?.gault||'';$('notes').value=x?.notes||'';$('photoUrl').value=(x?.photo&&String(x.photo).startsWith('http'))?x.photo:'';$('photoFile').value='';if(x?.date){let [d,m,y]=x.date.split('.');$('date').value=`${y}-${m}-${d}`}else $('date').value='';$('modal').classList.remove('hidden')}$('addOpen').onclick=()=>openForm();$('close').onclick=()=> $('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};window.edit=id=>openForm(find(id));
async function imageToDataURL(file){return new Promise((resolve,reject)=>{let fr=new FileReader();fr.onerror=reject;fr.onload=()=>{let im=new Image();im.onerror=reject;im.onload=()=>{let max=1200,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};im.src=fr.result};fr.readAsDataURL(file)})}
async function geocode(q){try{let r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);let d=await r.json();return d[0]?{lat:+d[0].lat,lon:+d[0].lon}:null}catch{return null}}$('form').onsubmit=async e=>{e.preventDefault();let old=editId?find(editId):null;let loc=old&&old.address===$('address').value&&old.city===$('city').value?{lat:old.lat,lon:old.lon}:await geocode([$('address').value,$('city').value].filter(Boolean).join(', '));if(!loc&&old)loc={lat:old.lat,lon:old.lon};if(!loc){alert('Adresse introuvable. Ajoute une ville ou une adresse plus précise.');return}let photo=old?.photo||'';if($('photoUrl').value.trim())photo=$('photoUrl').value.trim();if($('photoFile').files[0]){try{photo=await imageToDataURL($('photoFile').files[0])}catch{alert('Impossible de lire cette photo.');return}}let [y,m,d]=$('date').value.split('-');let obj={...old,photo,_uid:old?old._uid:`u${Date.now()}`,name:$('name').value.trim(),city:$('city').value.trim(),address:$('address').value.trim(),date:`${d}.${m}.${y}`,year:y,mich:$('mich').value,gault:$('gault').value.trim()||'—',notes:$('notes').value.trim(),...loc};if(old)items=items.map(x=>x===old?obj:x);else items.push(obj);items.forEach((x,i)=>x.i=i+1);persist();$('modal').classList.add('hidden');render();toast(old?'Expérience modifiée':'Expérience ajoutée')};
persist();render();renderHotels();initGlobe();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
