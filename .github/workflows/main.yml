name: Build Memories Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - memories-v2-preparation
    paths:
      - "app/**"
      - "scripts/prepare_v2_android.py"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Repair globe navigation for the offline Android build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/index.html")
          html = p.read_text(encoding="utf-8")
          fixes = {
              "const pages=['globe','list','hotels'];": "const pages=['map','list','hotels'];",
              "||'globe',busy=false": "||'map',busy=false",
              "showTab('globe');selectPoint(x)": "showTab('map');selectPoint(x)",
              "if(!e.target.closest('#globeScreen,#listScreen,#hotelScreen'))return;": "if(!e.target.closest('#mapScreen,#listScreen,#hotelScreen'))return;",
          }
          for before, after in fixes.items():
              count = html.count(before)
              if count != 1:
                  raise RuntimeError(f"Expected 1 occurrence of {before!r}, found {count}")
              html = html.replace(before, after, 1)
          p.write_text(html, encoding="utf-8")
          print("Globe navigation corrected; restaurant and hotel designs unchanged.")
          PY

      # V2 two-line city/country card layout; preserve badge positions.
      - name: Generate offline globe improvements and custom app icon
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 scripts/prepare_v2_android.py

      - name: Build independent V3 test APK (never replaces V1/V2)
        run: gradle --no-daemon assembleDebug

      - name: Upload Memories test APK
        uses: actions/upload-artifact@v4
        with:
          name: Memories-V3-PREVIEW13-INSTALL-ALONGSIDE
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
