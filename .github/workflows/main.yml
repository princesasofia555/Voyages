name: Build Memories Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - memories-v2-preparation
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build test APK (not for installation over existing app)
        run: gradle --no-daemon assembleDebug

      - name: Upload Memories test APK
        uses: actions/upload-artifact@v4
        with:
          name: Memories-V2-TEST-DO-NOT-INSTALL
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
