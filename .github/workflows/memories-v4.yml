name: Build Memories V4 Test APK
on:
  push:
    branches: [memories-v4]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use approved V3 design as V4 baseline
        run: |
          test -s app/src/main/assets/Memories_V3_Bordeaux_Harmonise_TEST-2.html
          cp app/src/main/assets/Memories_V3_Bordeaux_Harmonise_TEST-2.html app/src/main/assets/index.html
      - name: Restore existing experiences
        run: python scripts/restore_experiences.py
      - name: Restore approved Michelin asset
        run: python scripts/restore_bibendum.py
      - name: Generate launcher icon
        run: |
          python -m pip install --quiet Pillow
          python scripts/create_memories_icon.py
      - name: Add two photo collage pages
        run: python scripts/add_v4_photo_pages.py
      - name: Include newly reported restaurant visit
        run: python scripts/add_v4_new_visits.py
      - name: Restore original restaurant photos
        run: python scripts/restore_v4_original_photos.py
      - name: Fix book navigation, restaurant edits and back cover
        run: python scripts/fix_v4_book_and_restaurant.py
      - name: Add photo zoom and framing for all cards
        run: python scripts/add_v4_card_photo_crop.py
      - name: Enable direct photo editing in card lists
        run: python scripts/add_v4_direct_card_photo_edit.py
      - name: Integrate approved three-page artwork into Android app
        run: python scripts/apply_approved_photo_design.py
      - name: Repair photo pages 2 and 3 without touching page 1
        run: python scripts/fix_photo_pages_2_3.py
      - name: Remove literal escaped newline text from page footers
        run: python scripts/remove_literal_newline_artifacts.py
      - name: Enable horizontal swipe page navigation
        run: python scripts/enable_swipe_navigation.py
      - name: Lock collage photos until Edit Photos is selected
        run: python scripts/lock_photos_for_swipe.py
      - name: Hide obsolete cover and first-photo arrows
        run: python scripts/hide_cover_photo_arrows.py
      - name: Remove arrows from the actual book cover
        run: python scripts/remove_cover_arrows.py
      - name: Verify user-approved photo artwork on all three pages
        run: python scripts/verify_approved_photo_design.py
      - name: Check permanent signing secrets
        env:
          SIGNING_KEY: ${{ secrets.MEMORIES_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASS: ${{ secrets.MEMORIES_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.MEMORIES_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.MEMORIES_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY" && test -n "$SIGNING_STORE_PASS" && test -n "$SIGNING_ALIAS" && test -n "$SIGNING_KEY_PASS" || { echo "::error::Configure all four permanent Memories signing secrets"; exit 1; }
      - name: Restore permanent release keystore
        env:
          SIGNING_KEY: ${{ secrets.MEMORIES_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/memories-release.jks"
          chmod 600 "$RUNNER_TEMP/memories-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/memories-release.jks" -storepass "${{ secrets.MEMORIES_KEYSTORE_PASSWORD }}" >/dev/null
      - name: Build permanently signed release APK
        env:
          MEMORIES_KEYSTORE_PATH: ${{ runner.temp }}/memories-release.jks
          MEMORIES_KEYSTORE_PASSWORD: ${{ secrets.MEMORIES_KEYSTORE_PASSWORD }}
          MEMORIES_KEY_ALIAS: ${{ secrets.MEMORIES_KEY_ALIAS }}
          MEMORIES_KEY_PASSWORD: ${{ secrets.MEMORIES_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Verify signing certificate and package
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.sofiamagalhaes.memories'"
      - name: Verify actual APK contains all requested fixes
        run: |
          python - <<'PY'
          import zipfile, glob
          apk=glob.glob('app/build/outputs/apk/release/*.apk')[0]
          with zipfile.ZipFile(apk) as z:
              html=z.read('assets/index.html').decode('utf-8')
          checks={
            'backup bridge':'window.MemoriesAndroid.save(' in html,
            'card photo crop zoom':'function memoriesCropPhoto(img)' in html and 'memCropZoom' in html,
            'direct card photo editing':'memories-card-photo-direct-edit' in html and 'event.stopImmediatePropagation()' in html,
            'original V3 collage preserved':'z-index:9000;background:url(' not in html and html.count('MemoriesV3FreeCollage')>=1,
            'three repositioned photo toolbars':html.count('.toolbar{position:absolute;top:3.2%;right:17%;')==3,
            'full-screen back cover':'memories-v4-back-cover-fullscreen' in html,
            'restaurant save correction':'if(!persist())return;renderFlatMap();' in html,
            'new Neusa visit':'16.11.2026' in html,
            'three photo pages':'collage3Screen' in html,
            'unique restaurant editing IDs':'const find=id=>items.find(x=>String(x._uid)===String(id));' in html,
            'hide extra photo menus':'memories-v4-hide-extra-photo-tools' in html,
          }
          for k,v in checks.items(): print(k, 'PASS' if v else 'FAIL')
          assert all(checks.values()),'APK failed double verification'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Memories-Permanent-Signed-APK
          path: app/build/outputs/apk/release/*.apk
