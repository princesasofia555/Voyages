name: Build Memories V3 APK
on:
  workflow_dispatch:
  push:
    branches: [memories-v3-apk]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command line tools are missing"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use validated Memories V3
        run: |
          test -s app/src/main/assets/Memories_V3_Bordeaux_Harmonise_TEST-2.html
          cp app/src/main/assets/Memories_V3_Bordeaux_Harmonise_TEST-2.html app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Memories-V3-APK
          path: app/build/outputs/apk/debug/*.apk
