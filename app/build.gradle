plugins { id 'com.android.application' }

android {
    namespace 'com.sofiamagalhaes.voyages'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sofiamagalhaes.voyages'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '3.12'
    }

    buildTypes {
        debug {
            // Isolated V3 preview 13: temporary side-by-side visual test, no existing app replacement.
            applicationIdSuffix '.v3preview13'
            versionNameSuffix '-test'
        }
    }
}
