plugins { id 'com.android.application' }

android {
    namespace 'com.sofiamagalhaes.voyages'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sofiamagalhaes.voyages'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '3.1'
    }

    buildTypes {
        debug {
            // Isolated V3 preview 2: cannot overwrite V1, V2, or the existing V3 test package.
            applicationIdSuffix '.v3preview2'
            versionNameSuffix '-test'
        }
    }
}
