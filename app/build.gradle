plugins { id 'com.android.application' }

android {
    namespace 'com.sofiamagalhaes.voyages'
    compileSdk 35

    defaultConfig {
        // V4 is installed alongside V3: it never overwrites V3's private data.
        applicationId 'com.sofiamagalhaes.memories'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '5.0.0'
    }

    signingConfigs {
        permanentRelease {
            def keystoreFile = System.getenv('MEMORIES_KEYSTORE_PATH')
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('MEMORIES_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MEMORIES_KEY_ALIAS')
                keyPassword System.getenv('MEMORIES_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.permanentRelease
        }
    }
}
