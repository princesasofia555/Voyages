plugins { id 'com.android.application' }

android {
    namespace 'com.sofiamagalhaes.voyages'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sofiamagalhaes.voyages'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }

    buildTypes {
        debug {
            // V3 preview uses a separate package: never overwrites V1 or V2 memories.
            applicationIdSuffix '.v3test'
            versionNameSuffix '-test'
        }
    }
}
