plugins { id 'com.android.application' }

android {
    namespace 'com.sofiamagalhaes.voyages'
    compileSdk 35

    // Android updates require the exact applicationId of the installed APK.
    // Never silently choose between the two historical IDs.
    def updateApplicationId = System.getenv('MEMORIES_APPLICATION_ID')
    if (!(updateApplicationId in ['com.sofiamagalhaes.voyages', 'com.sofiamagalhaes.memories.v3test'])) {
        throw new GradleException('Set MEMORIES_APPLICATION_ID to the verified installed application ID before building.')
    }

    defaultConfig {
        applicationId updateApplicationId
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '3.0.1'
    }

    signingConfigs {
        memoriesRelease {
            def storePath = System.getenv('MEMORIES_SIGNING_STORE_FILE')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('MEMORIES_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('MEMORIES_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('MEMORIES_SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.memoriesRelease
            minifyEnabled false
        }
    }
}
