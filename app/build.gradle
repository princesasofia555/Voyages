plugins { id 'com.android.application' }

android {
    namespace 'com.sofiamagalhaes.voyages'
    compileSdk 35

    defaultConfig {
        // V4 is installed alongside V3: it never overwrites V3's private data.
        applicationId 'com.sofiamagalhaes.memories.v4photocropnov18'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '4.0.7'
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
